# Beyond 底层出口配置 —— /etc/mihomo/beyond.conf
#
# 只有 BEYOND_IFACE 是必须的;其余留空则自动推导:
#   BEYOND_SRCIP  ← 该网卡的 IPv4 地址
#   BEYOND_GW     ← 该网卡在任意路由表里的 default via
#   onlink        ← 该网卡直连网段是否在主表(不在则自动加 onlink)
#
# 切换网卡只改这一行。改完执行:
#   sudo systemctl restart mihomo    (启动链会重新装路由)
# 或立即生效:
#   sudo /etc/mihomo/ensure-beyond-underlay.sh

BEYOND_IFACE=eno1

# 2026-09-25 从 eno2 切到 eno1:eno2 所在网段(192.168.10.x)是校园网,
# 认证过期后上游用自签证书透明劫持 HTTPS,edge 拿到的是 gw.buaa.edu.cn 的
# 认证跳转 HTML 而不是 JSON,报 confagent.go:87 invalid character '<',
# 永远拿不到节点列表 → 隧道建不起来、控制台显示离线。
# eno1(192.168.31.x)证书正常(CN=*.beyondnetwork.cn),故迁移至此。

# 以下留空即自动推导,需要覆盖时再填
#BEYOND_SRCIP=
#BEYOND_GW=
BEYOND_DNS=223.5.5.5
BEYOND_DOMAINS="api1.beyondnetwork.cn"
# 从控制面/mihomo 日志观测到的节点(域名解析失败时的兜底)
BEYOND_STATIC="47.94.106.154 8.156.75.62 139.196.45.11 42.240.157.83"
